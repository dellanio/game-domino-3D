<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dominó 3D</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <section id="menu" class="start-menu" aria-labelledby="menu-title">
      <form id="menu-form" class="menu-card">
        <img id="menu-logo" class="menu-logo" alt="Dominó 3D" width="2172" height="724" />
        <p id="menu-context" class="eyebrow">Sua próxima jogada começa aqui</p>
        <h1 id="menu-title">A mesa está pronta.</h1>
        <p class="menu-intro">Você contra a IA. Escolha sua mão inicial e jogue até 100 pontos.</p>
        <fieldset class="theme-options">
          <legend>Tema</legend>
          <label><input type="radio" name="theme" value="default" checked /><span>Default</span></label>
          <label><input type="radio" name="theme" value="brasil" /><span>Brasil</span></label>
        </fieldset>
        <fieldset class="mode-options">
          <legend>Escolha o modo de jogo</legend>
          <label class="mode-card"><input type="radio" name="mode" value="7" checked /><span><strong>Clássico</strong><b>7 pedras</b><small>A experiência tradicional, com mais opções na mão.</small></span></label>
          <label class="mode-card"><input type="radio" name="mode" value="3" /><span><strong>Rápido</strong><b>3 pedras</b><small>Uma mão curta para começar com agilidade.</small></span></label>
          <label class="mode-card"><input type="radio" name="mode" value="5" /><span><strong>Compacto</strong><b>5 pedras</b><small>Uma mão intermediária para equilibrar suas escolhas.</small></span></label>
        </fieldset>
        <p class="menu-rules">Sem encaixe? Compre do monte até poder jogar. Se o monte acabar, passe a vez. Vença a IA e alcance 100 pontos.</p>
        <button id="btn-play" class="btn play-button" type="submit">Jogar</button>
      </form>
    </section>
    <div id="game-ui" inert hidden>
    <div id="stage"></div>
    <div class="vignette"></div>

    <header class="hud-top">
      <div class="brand"><img id="hud-logo" alt="Dominó 3D" width="2172" height="724" decoding="async" /></div>
      <div class="score" role="group" aria-label="Placar da partida">
        <div class="player you"><small>Você</small><b id="score-you">0</b></div>
        <div class="target"><span>Meta</span><b id="target">100</b></div>
        <div class="player ai"><small>IA</small><b id="score-ai">0</b></div>
      </div>
      <div class="round"><span id="current-mode"></span><span>Rodada <b id="round">1</b></span><button id="btn-menu" class="btn menu-return" type="button">Voltar ao menu</button></div>
    </header>

    <div class="status" id="status" role="status" aria-live="polite"></div>

    <footer class="hud-bottom">
      <button id="btn-draw" class="btn" hidden>Comprar <span id="boneyard-count"></span></button>
      <button id="btn-pass" class="btn ghost" hidden>Passar a vez</button>
    </footer>

    </div>

    <aside class="music-panel" aria-label="Áudio">
      <button id="music-toggle" class="sound-toggle" type="button" aria-pressed="true" aria-label="Desligar som">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M11 5 6 9H3v6h3l5 4Z" />
          <g class="sound-waves"><path d="M15 8a6 6 0 0 1 0 8M18 5a10 10 0 0 1 0 14" /></g>
          <path class="sound-muted" d="m16 9 5 6m0-6-5 6" />
        </svg>
      </button>
      <span id="music-status" class="music-status" role="status" aria-live="polite"></span>
    </aside>

    <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" aria-describedby="modal-text" hidden>
      <div class="card">
        <h2 id="modal-title"></h2>
        <p id="modal-text"></p>
        <button id="modal-btn" class="btn menu-return round-next"></button>
        <button id="modal-menu" class="btn menu-return" type="button">Voltar ao menu</button>
        <a class="about-audio" href="./audio/credits.html" target="_blank" rel="noopener noreferrer" aria-label="Informações sobre a trilha sonora" title="Sobre a trilha sonora">ⓘ</a>
      </div>
    </div>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
